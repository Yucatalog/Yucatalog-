<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yucatalog — Catálogo de Accesorios</title>
  <meta name="description" content="Catálogo digital de accesorios para automóvil, espejos con luz LED y gadgets prácticos. Cotiza y pide directo por WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --surface-soft: #f1f4f8;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --primary-hover: #272f40;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --whatsapp: #16a34a;
      --whatsapp-hover: #15803d;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.09);
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.22);
      --transition: 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #111827 0%, #0f766e 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .search-box {
      position: relative;
      flex: 1 1 260px;
      max-width: 420px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 10px 38px 10px 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--text);
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
    }

    .search-input:focus {
      outline: none;
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      place-items: center;
      font-size: 1rem;
    }

    .search-clear.visible {
      display: grid;
    }

    .search-clear:hover {
      background: var(--border);
      color: var(--text);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 56px;
    }

    /* Filter Bar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      max-width: 100%;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition);
    }

    .cat-btn:hover {
      border-color: #cbd5e1;
      color: var(--text);
    }

    .cat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(17, 24, 39, 0.16);
    }

    .results-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (min-width: 720px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }
    }

    @media (min-width: 1040px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 26px;
      }
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      text-align: left;
      padding: 0;
      font-family: inherit;
      color: inherit;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #d1d5db;
    }

    .product-card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--surface-soft);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-media img,
    .card-media .svg-fallback {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .product-card:hover .card-media img,
    .product-card:hover .card-media .svg-fallback {
      transform: scale(1.04);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.08);
    }

    .card-views-pill {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(17, 24, 39, 0.76);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 6px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-price {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .card-cta {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 56px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
    }

    .empty-state h3 {
      font-size: 1.08rem;
      margin-bottom: 6px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .btn-reset {
      border: none;
      background: var(--primary);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-dialog {
      background: var(--surface);
      width: 100%;
      max-width: 960px;
      max-height: 92vh;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      position: relative;
      transform: translateY(18px) scale(0.98);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-overlay.open .modal-dialog {
      transform: translateY(0) scale(1);
    }

    @media (min-width: 820px) {
      .modal-dialog {
        grid-template-columns: 1.08fr 0.92fr;
      }
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(17, 24, 39, 0.1);
      background: rgba(255, 255, 255, 0.94);
      color: var(--text);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
      transition: background var(--transition), transform var(--transition);
    }

    .modal-close:hover {
      background: var(--surface);
      transform: scale(1.06);
    }

    /* Carousel Column */
    .modal-gallery {
      background: var(--surface-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      gap: 12px;
    }

    .carousel-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--border);
      touch-action: pan-y;
      user-select: none;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .carousel-slide img,
    .carousel-slide .svg-fallback {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .slide-caption {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(17, 24, 39, 0.78);
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      max-width: calc(100% - 24px);
    }

    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background var(--transition), transform var(--transition);
      z-index: 5;
    }

    .carousel-nav:hover {
      background: #ffffff;
      transform: translateY(-50%) scale(1.06);
    }

    .carousel-nav.prev {
      left: 10px;
    }

    .carousel-nav.next {
      right: 10px;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 7px;
    }

    .carousel-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: none;
      background: #cbd5e1;
      cursor: pointer;
      transition: all var(--transition);
      padding: 0;
    }

    .carousel-dot.active {
      width: 22px;
      background: var(--primary);
    }

    .carousel-thumbs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .thumb-btn {
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #ffffff;
      aspect-ratio: 4 / 3;
      cursor: pointer;
      padding: 0;
      opacity: 0.68;
      transition: all var(--transition);
    }

    .thumb-btn:hover {
      opacity: 0.95;
    }

    .thumb-btn.active {
      border-color: var(--accent);
      opacity: 1;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.18);
    }

    .thumb-btn img,
    .thumb-btn .svg-fallback {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Product Details Column */
    .modal-info {
      padding: 24px 24px 22px;
      overflow-y: auto;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (max-width: 819px) {
      .modal-dialog {
        overflow-y: auto;
      }
      .modal-info {
        max-height: none;
        overflow-y: visible;
      }
    }

    .modal-category {
      display: inline-block;
      align-self: flex-start;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .modal-title {
      font-size: 1.32rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      padding-right: 28px;
    }

    .modal-price {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .modal-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .variants-block h4,
    .specs-block h4,
    .features-block h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .variants-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .variant-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all var(--transition);
    }

    .variant-chip:hover {
      border-color: #94a3b8;
    }

    .variant-chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .variant-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      background: var(--surface-soft);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      border: 1px solid var(--border);
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.86rem;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(229, 231, 235, 0.9);
    }

    .spec-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .spec-label {
      color: var(--text-muted);
      font-weight: 600;
      flex-shrink: 0;
    }

    .spec-value {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }

    .features-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .features-list li {
      font-size: 0.88rem;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .features-list li::before {
      content: "✓";
      color: var(--accent);
      font-weight: 800;
      flex-shrink: 0;
    }

    .btn-whatsapp {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      background: var(--whatsapp);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.25);
    }

    .btn-whatsapp:hover {
      background: var(--whatsapp-hover);
      transform: translateY(-1px);
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 26px 20px;
    }

    .footer-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-copy {
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .footer-copy strong {
      color: var(--text);
    }

    .footer-wa {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--whatsapp);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 700;
      transition: background var(--transition);
    }

    .footer-wa:hover {
      background: var(--whatsapp-hover);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="Inicio">
        <div class="brand-mark" id="brandMark">Y</div>
        <div class="brand-text">
          <h1 id="storeName">Yucatalog</h1>
          <p id="storeSubtitle">Catálogo</p>
        </div>
      </a>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Buscar fundas, espejos LED, accesorios..."
          aria-label="Buscar productos"
        />
        <button type="button" id="searchClear" class="search-clear" aria-label="Limpiar búsqueda">&times;</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="toolbar" aria-label="Filtros de categoría">
      <div class="categories" id="categoryTabs" role="tablist"></div>
      <div class="results-count" id="resultsCount"></div>
    </section>

    <section class="product-grid" id="productGrid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">
        <strong id="footerBrand">Yucatalog</strong> · Envíos y entregas coordinadas directo por WhatsApp.
      </p>

              <line x1="325" y1="213" x2="325" y2="255" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
              <line x1="340" y1="213" x2="340" y2="255" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
              <line x1="355" y1="213" x2="355" y2="255" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
              <line x1="370" y1="213" x2="370" y2="255" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
              <polygon points="415,165 495,180 495,198 415,213" fill="#475569"/>
            `)
          },
          {
            url: "",
            etiqueta: "Filtro HEPA lavable y depósito transparente",
            svg: makeIllustration("#eff6ff", "#dbeafe", "#2563eb", "Filtro HEPA Reutilizable", "Fácil de desmontar y lavar", `
              <rect x="260" y="120" width="120" height="190" rx="22" fill="#ffffff" stroke="#3b82f6" stroke-width="5"/>
              <line x1="280" y1="150" x2="360" y2="150" stroke="#93c5fd" stroke-width="5"/>
              <line x1="280" y1="175" x2="360" y2="175" stroke="#93c5fd" stroke-width="5"/>
              <line x1="280" y1="200" x2="360" y2="200" stroke="#93c5fd" stroke-width="5"/>
              <line x1="280" y1="225" x2="360" y2="225" stroke="#93c5fd" stroke-width="5"/>
              <line x1="280" y1="250" x2="360" y2="250" stroke="#93c5fd" stroke-width="5"/>
              <line x1="280" y1="275" x2="360" y2="275" stroke="#93c5fd" stroke-width="5"/>
            `)
          }
        ]
      },
      {
        id: "soporte-magnetico-auto",
        nombre: "Soporte Magnético Plegable 360° para Celular",
        categoria: "Accesorios",
        precio: 189,
        descripcion: "Soporte ultracompacto con imanes de neodimio N52 para tablero de auto o escritorio, con giro completo de 360°.",
        variantes: [
          { nombre: "Negro Aluminio", color: "#18181b" },
          { nombre: "Plata Metálico", color: "#cbd5e1" }
        ],
        especificaciones: {
          medidas: "5.8 × 5.8 × 2.2 cm (plegado)",
          material: "Aleación de aluminio + imanes N52 + base adhesiva 3M",
          contenido: "1 soporte magnético, 2 placas metálicas delgadas y 1 repuesto adhesivo 3M"
        },
        caracteristicas: [
          "Sujeción firme incluso en topes y calles irregulares",
          "Brazo plegable discreto que no obstruye la visibilidad",
          "Rotación 360° para ver mapas en vertical u horizontal",
          "Compatible con iPhone (MagSafe) y cualquier smartphone Android"
        ],
        imagenes: [
          {
            url: "",
            etiqueta: "Vista principal — Cabezal magnético 360°",
            svg: makeIllustration("#f8fafc", "#e2e8f0", "#111827", "Soporte Magnético N52", "Rotación 360° · Brazo plegable", `
              <ellipse cx="320" cy="310" rx="85" ry="22" fill="#334155"/>
              <rect x="302" y="195" width="36" height="115" rx="14" fill="#1e293b"/>
              <circle cx="320" cy="175" r="68" fill="#111827" stroke="#64748b" stroke-width="6"/>
              <circle cx="320" cy="175" r="42" fill="none" stroke="#0f766e" stroke-width="6" stroke-dasharray="14 8"/>
            `)
          },
          {
            url: "",
            etiqueta: "Plegado compacto para tablero o escritorio",
            svg: makeIllustration("#f1f5f9", "#e0f2fe", "#0284c7", "Diseño Discreto y Compacto", "Se pliega a solo 2.2 cm de alto", `
              <rect x="210" y="210" width="220" height="44" rx="16" fill="#1e293b"/>
              <rect x="235" y="192" width="170" height="24" rx="10" fill="#475569"/>
              <line x1="175" y1="278" x2="465" y2="278" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
            `)
          },
          {
            url: "",
            etiqueta: "Incluye placas metálicas y adhesivo 3M",
            svg: makeIllustration("#f8fafc", "#f3f4f6", "#0f766e", "Compatible con Cualquier Teléfono", "Incluye 2 placas y base 3M", `
              <circle cx="245" cy="215" r="54" fill="#1e293b" stroke="#94a3b8" stroke-width="4"/>
              <circle cx="245" cy="215" r="32" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 6"/>
              <rect x="345" y="160" width="110" height="110" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
              <text x="400" y="222" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">3M</text>
            `)
          }
        ]
      }
    ];

    // =========================================================================
    // 4. LÓGICA DE LA APLICACIÓN
    // =========================================================================
    const state = {
      categoriaActiva: "Todos",
      busqueda: "",
      productoActual: null,
      indiceSlide: 0,
      varianteActiva: ""
    };

    const $ = (id) => document.getElementById(id);

    const els = {
      brandMark: $("brandMark"),
      storeName: $("storeName"),
      storeSubtitle: $("storeSubtitle"),
      footerBrand: $("footerBrand"),
      footerWhatsapp: $("footerWhatsapp"),
      searchInput: $("searchInput"),
      searchClear: $("searchClear"),
      categoryTabs: $("categoryTabs"),
      resultsCount: $("resultsCount"),
      productGrid: $("productGrid"),
      modal: $("productModal"),
      modalClose: $("modalClose"),
      carouselStage: $("carouselStage"),
      carouselTrack: $("carouselTrack"),
      carouselPrev: $("carouselPrev"),
      carouselNext: $("carouselNext"),
      carouselDots: $("carouselDots"),
      carouselThumbs: $("carouselThumbs"),
      modalCategory: $("modalCategory"),
      modalTitle: $("modalTitle"),
      modalPrice: $("modalPrice"),
      modalDesc: $("modalDesc"),
      variantsBlock: $("variantsBlock"),
      variantsList: $("variantsList"),
      specsGrid: $("specsGrid"),
      featuresList: $("featuresList"),
      modalWhatsapp: $("modalWhatsapp")
    };

    function formatPrice(amount) {
      return new Intl.NumberFormat("es-MX", {
        style: "currency",
        currency: CONFIG.moneda,
        maximumFractionDigits: 0
      }).format(amount) + " " + CONFIG.moneda;
    }

    function buildWhatsAppUrl(message) {
      return `https://wa.me/${CONFIG.telefonoWhatsApp}?text=${encodeURIComponent(message)}`;
    }

    function createMediaElement(imgObj, altText) {
      const wrapper = document.createElement("div");
      wrapper.style.width = "100%";
      wrapper.style.height = "100%";

      if (imgObj.url && imgObj.url.trim() !== "") {
        const img = document.createElement("img");
        img.src = imgObj.url.trim();
        img.alt = altText;
        img.loading = "lazy";
        img.onerror = () => {
          wrapper.innerHTML = imgObj.svg;
        };
        wrapper.appendChild(img);
      } else {
        wrapper.innerHTML = imgObj.svg;
      }
      return wrapper;
    }

    function initBranding() {
      document.title = `${CONFIG.nombreTienda} — ${CONFIG.subtitulo}`;
      els.brandMark.textContent = CONFIG.nombreTienda.charAt(0).toUpperCase();
      els.storeName.textContent = CONFIG.nombreTienda;
      els.storeSubtitle.textContent = CONFIG.subtitulo;
      els.footerBrand.textContent = CONFIG.nombreTienda;
      els.footerWhatsapp.href = buildWhatsAppUrl(
        `Hola ${CONFIG.nombreTienda}, vi su catálogo web y me gustaría más información sobre sus productos.`
      );
    }

    function renderCategories() {
      const categorias = ["Todos", "Automóvil", "Espejos LED", "Accesorios"];
      els.categoryTabs.innerHTML = "";
      categorias.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-btn" + (state.categoriaActiva === cat ? " active" : "");
        btn.textContent = cat;
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", String(state.categoriaActiva === cat));
        btn.addEventListener("click", () => {
          state.categoriaActiva = cat;
          renderCategories();
          renderProducts();
        });
        els.categoryTabs.appendChild(btn);
      });
    }

    function getFilteredProducts() {
      const q = state.busqueda.trim().toLowerCase();
      return PRODUCTOS.filter((p) => {
        const matchCat = state.categoriaActiva === "Todos" || p.categoria === state.categoriaActiva;
        if (!matchCat) return false;
        if (!q) return true;
        const searchable = [
          p.nombre,
          p.categoria,
          p.descripcion,
          p.especificaciones.material,
          ...p.caracteristicas
        ].join(" ").toLowerCase();
        return searchable.includes(q);
      });
    }

    function renderProducts() {
      const lista = getFilteredProducts();
      els.resultsCount.textContent =
        lista.length === 1 ? "1 producto" : `${lista.length} productos`;

      els.productGrid.innerHTML = "";

      if (lista.length === 0) {
        els.productGrid.innerHTML = `
          <div class="empty-state">
            <h3>No encontramos coincidencias</h3>
            <p>Prueba con otra palabra clave o vuelve a ver todas las categorías.</p>
            <button type="button" class="btn-reset" id="resetFiltersBtn">Ver todo el catálogo</button>
          </div>
        `;
        $("resetFiltersBtn").addEventListener("click", () => {
          state.categoriaActiva = "Todos";
          state.busqueda = "";
          els.searchInput.value = "";
          els.searchClear.classList.remove("visible");
          renderCategories();
          renderProducts();
        });
        return;
      }

      lista.forEach((producto) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "product-card";
        card.setAttribute("aria-label", `Ver detalles de ${producto.nombre}`);

        const media = document.createElement("div");
        media.className = "card-media";
        media.appendChild(createMediaElement(producto.imagenes[0], producto.nombre));

        const badge = document.createElement("span");
        badge.className = "card-badge";
        badge.textContent = producto.categoria;
        media.appendChild(badge);

        const views = document.createElement("span");
        views.className = "card-views-pill";
        views.textContent = `${producto.imagenes.length} fotos`;
        media.appendChild(views);

        const body = document.createElement("div");
        body.className = "card-body";
        body.innerHTML = `
          <h3 class="card-title">${producto.nombre}</h3>
          <div class="card-footer">
            <span class="card-price">${formatPrice(producto.precio)}</span>
            <span class="card-cta">Ver detalles →</span>
          </div>
        `;

        card.appendChild(media);
        card.appendChild(body);
        card.addEventListener("click", () => openModal(producto));
        els.productGrid.appendChild(card);
      });
    }

    function updateModalWhatsApp() {
      const p = state.productoActual;
      if (!p) return;
      const varianteTxt = state.varianteActiva ? ` (Color/Variante: ${state.varianteActiva})` : "";
      const msg = `Hola ${CONFIG.nombreTienda}, me interesa el producto: ${p.nombre}${varianteTxt} con precio de ${formatPrice(p.precio)}. ¿Tienes disponibilidad?`;
      els.modalWhatsapp.href = buildWhatsAppUrl(msg);
    }

    function updateCarouselUI() {
      const p = state.productoActual;
      if (!p) return;
      els.carouselTrack.style.transform = `translateX(-${state.indiceSlide * 100}%)`;

      Array.from(els.carouselDots.children).forEach((dot, idx) => {
        dot.classList.toggle("active", idx === state.indiceSlide);
      });
      Array.from(els.carouselThumbs.children).forEach((thumb, idx) => {
        thumb.classList.toggle("active", idx === state.indiceSlide);
      });
    }

    function goToSlide(index) {
      const p = state.productoActual;
      if (!p) return;
      const total = p.imagenes.length;
      state.indiceSlide = (index + total) % total;
      updateCarouselUI();
    }

    function openModal(producto) {
      state.productoActual = producto;
      state.indiceSlide = 0;
      state.varianteActiva = producto.variantes && producto.variantes.length ? producto.variantes[0].nombre : "";

      els.modalCategory.textContent = producto.categoria;
      els.modalTitle.textContent = producto.nombre;
      els.modalPrice.textContent = formatPrice(producto.precio);
      els.modalDesc.textContent = producto.descripcion;

      // Carrusel
      els.carouselTrack.innerHTML = "";
      els.carouselDots.innerHTML = "";
      els.carouselThumbs.innerHTML = "";

      producto.imagenes.forEach((imgObj, idx) => {
        const slide = document.createElement("div");
        slide.className = "carousel-slide";
        slide.appendChild(createMediaElement(imgObj, `${producto.nombre} - ${imgObj.etiqueta}`));

        if (imgObj.etiqueta) {
          const cap = document.createElement("span");
          cap.className = "slide-caption";
          cap.textContent = imgObj.etiqueta;
          slide.appendChild(cap);
        }
        els.carouselTrack.appendChild(slide);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "carousel-dot";
        dot.setAttribute("aria-label", `Ir a foto ${idx + 1}`);
        dot.addEventListener("click", () => goToSlide(idx));
        els.carouselDots.appendChild(dot);

        const thumb = document.createElement("button");
        thumb.type = "button";
        thumb.className = "thumb-btn";
        thumb.setAttribute("aria-label", `Miniatura ${idx + 1}`);
        thumb.appendChild(createMediaElement(imgObj, `Miniatura ${idx + 1}`));
        thumb.addEventListener("click", () => goToSlide(idx));
        els.carouselThumbs.appendChild(thumb);
      });

      // Variantes
      els.variantsList.innerHTML = "";
      if (producto.variantes && producto.variantes.length) {
        els.variantsBlock.style.display = "block";
        producto.variantes.forEach((v) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "variant-chip" + (v.nombre === state.varianteActiva ? " active" : "");
          chip.innerHTML = `<span class="variant-dot" style="background:${v.color}"></span>${v.nombre}`;
          chip.addEventListener("click", () => {
            state.varianteActiva = v.nombre;
            Array.from(els.variantsList.children).forEach((el) => el.classList.remove("active"));
            chip.classList.add("active");
            updateModalWhatsApp();
          });
          els.variantsList.appendChild(chip);
        });
      } else {
        els.variantsBlock.style.display = "none";
      }

      // Especificaciones
      els.specsGrid.innerHTML = `
        <div class="spec-row"><span class="spec-label">Medidas</span><span class="spec-value">${producto.especificaciones.medidas}</span></div>
        <div class="spec-row"><span class="spec-label">Material</span><span class="spec-value">${producto.especificaciones.material}</span></div>
        <div class="spec-row"><span class="spec-label">Contenido del paquete</span><span class="spec-value">${producto.especificaciones.contenido}</span></div>
      `;

      // Características
      els.featuresList.innerHTML = "";
      producto.caracteristicas.forEach((feat) => {
        const li = document.createElement("li");
        li.textContent = feat;
        els.featuresList.appendChild(li);
      });

      updateCarouselUI();
      updateModalWhatsApp();

      els.modal.classList.add("open");
      els.modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      els.modalClose.focus();
    }

    function closeModal() {
      els.modal.classList.remove("open");
      els.modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      state.productoActual = null;
    }

    // Eventos de búsqueda
    els.searchInput.addEventListener("input", (e) => {
      state.busqueda = e.target.value;
      els.searchClear.classList.toggle("visible", state.busqueda.length > 0);
      renderProducts();
    });

    els.searchClear.addEventListener("click", () => {
      state.busqueda = "";
      els.searchInput.value = "";
      els.searchClear.classList.remove("visible");
      renderProducts();
      els.searchInput.focus();
    });

    // Eventos del modal y carrusel
    els.modalClose.addEventListener("click", closeModal);
    els.modal.addEventListener("click", (e) => {
      if (e.target === els.modal) closeModal();
    });
    els.carouselPrev.addEventListener("click", () => goToSlide(state.indiceSlide - 1));
    els.carouselNext.addEventListener("click", () => goToSlide(state.indiceSlide + 1));

    // Teclado
    document.addEventListener("keydown", (e) => {
      if (!els.modal.classList.contains("open")) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "ArrowLeft") goToSlide(state.indiceSlide - 1);
      if (e.key === "ArrowRight") goToSlide(state.indiceSlide + 1);
    });

    // Gestos táctiles (swipe) en el carrusel
    let touchStartX = 0;
    let touchEndX = 0;
    els.carouselStage.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    els.carouselStage.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 40) {
        goToSlide(diff > 0 ? state.indiceSlide + 1 : state.indiceSlide - 1);
      }
    }, { passive: true });

    // Inicializar
    initBranding();
    renderCategories();
    renderProducts();
  </script>
</body>
</html>
